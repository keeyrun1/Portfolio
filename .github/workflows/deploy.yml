name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      publish_dir: ${{ steps.set-publish-dir.outputs.publish_dir }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Detect project type
        id: detect
        run: |
          echo "Checking for package.json and build folder..."
          if [ -f package.json ]; then
            echo "has_package=true" >> $GITHUB_OUTPUT
          else
            echo "has_package=false" >> $GITHUB_OUTPUT
          fi

      - name: Set publish_dir output
        id: set-publish-dir
        run: |
          if [ "${{ steps.detect.outputs.has_package }}" = "true" ]; then
            # Default build output for many tools; change if your build outputs elsewhere
            echo "publish_dir=./dist" >> $GITHUB_OUTPUT
          else
            echo "publish_dir=." >> $GITHUB_OUTPUT
          fi

      - name: Setup Node (only if package.json exists)
        if: ${{ steps.detect.outputs.has_package == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and build (only if package.json exists)
        if: ${{ steps.detect.outputs.has_package == 'true' }}
        run: |
          npm ci
          # Adjust build command if your project uses a different script
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found; skipping build step"
          fi

      - name: Prepare list of HTML files to patch (debug)
        run: |
          echo "Publish dir: ${{ steps.set-publish-dir.outputs.publish_dir }}"
          echo "Files in publish dir:"
          ls -la "${{ steps.set-publish-dir.outputs.publish_dir }}" || true

      - name: Inject cache-busting token into HTML (robust, cross-runner)
        run: |
          set -euo pipefail
          SHA=${GITHUB_SHA::8}
          PUBLISH_DIR="${{ steps.set-publish-dir.outputs.publish_dir }}"
          echo "Using SHA=$SHA"
          echo "PUBLISH_DIR=$PUBLISH_DIR"

          # If publishing a build folder, target its index.html; otherwise patch tracked HTML files
          if [ "$PUBLISH_DIR" != "." ]; then
            TARGETS="$PUBLISH_DIR/index.html"
          else
            # list tracked html files in repo root and subfolders
            TARGETS=$(git ls-files '*.html' || true)
          fi

          if [ -z "$TARGETS" ]; then
            echo "No HTML files found to patch; skipping cache-busting"
            exit 0
          fi

          for f in $TARGETS; do
            [ -f "$f" ] || { echo "File $f not found, skipping"; continue; }
            echo "Patching $f"
            # GNU sed on ubuntu-latest: -i -E
            sed -i -E "s/(\.css)\"/\1?v=${SHA}\"/g" "$f" || true
            sed -i -E "s/(\.js)\"/\1?v=${SHA}\"/g" "$f" || true
          done

      - name: Choose deploy token (use PAT if provided)
        id: set-token
        run: |
          if [ -n "${{ secrets.PAT_TOKEN }}" ]; then
            echo "Using PAT_TOKEN from secrets"
            echo "token=${{ secrets.PAT_TOKEN }}" >> $GITHUB_OUTPUT
          else
            echo "Using default GITHUB_TOKEN"
            echo "token=${{ github.token }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ steps.set-token.outputs.token }}
          publish_branch: gh-pages
          publish_dir: ${{ steps.set-publish-dir.outputs.publish_dir }}
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
